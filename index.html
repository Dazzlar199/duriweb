<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DURI Entertainment</title>
    <link rel="icon" type="image/png" href="/public/images/logo4.png" />
    <link
      rel="shortcut icon"
      type="image/png"
      href="/public/images/logo4.png"
    />
    <link rel="apple-touch-icon" href="/public/images/logo4.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        background-color: #000000;
        color: #ffffff;
        font-family: "Inter", "Noto Sans KR", sans-serif;
        min-height: 100vh;
        overflow-x: hidden;
        position: relative;
      }

      /* 배경 영상 */
      .video-background {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        overflow: hidden;
      }

      .video-background video {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 60%;
        height: 60%;
        object-fit: cover;
        opacity: 0.8;
      }

      .video-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.4);
        z-index: 0;
      }

      /* 헤더 */
      header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        padding: 20px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        z-index: 100;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      /* 로고 (좌측) */
      .header-logo {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
        color: #ffffff;
      }

      .header-logo img {
        width: 60px;
        height: auto;
      }

      .header-logo span {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 2px;
      }

      /* 네비게이션 (가운데) - index.html에서는 사용하지 않음 */
      .nav-menu {
        display: none;
      }

      /* 언어 설정 (우측) */
      .language-selector {
        position: relative;
      }

      .language-btn {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 24px;
        padding: 5px;
        display: flex;
        align-items: center;
        gap: 5px;
        min-width: 44px;
        min-height: 44px;
        justify-content: center;
      }

      .language-btn::after {
        content: "";
        width: 0;
        height: 0;
        border-left: 4px solid transparent;
        border-right: 4px solid transparent;
        border-top: 5px solid #ffffff;
        margin-left: 5px;
      }

      .language-dropdown {
        position: absolute;
        top: 100%;
        right: 0;
        background: rgba(0, 0, 0, 0.9);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        display: none;
        min-width: 120px;
        overflow: hidden;
      }

      .language-dropdown.active {
        display: block;
      }

      .language-dropdown a {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        text-decoration: none;
        color: #ffffff;
        font-size: 13px;
        transition: background 0.2s ease;
      }

      .language-dropdown a:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .language-dropdown a .flag {
        font-size: 18px;
      }

      /* 메인 컨테이너 */
      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        min-height: 100vh;
        padding: 120px 20px 150px;
        text-align: center;
        position: relative;
        z-index: 10;
      }

      /* 메인 로고 영역 */
      .logo-wrapper {
        margin-bottom: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .logo-wrapper img {
        width: 80px;
        height: auto;
        clip-path: inset(0 100% 0 0);
        animation: logoReveal 1.5s cubic-bezier(0.77, 0, 0.175, 1) forwards;
      }

      .logo-text {
        display: none;
      }

      /* Coming Soon */
      .coming-soon {
        font-size: 24px;
        font-weight: 200;
        letter-spacing: 8px;
        color: rgba(255, 255, 255, 0.7);
        text-transform: lowercase;
        margin-top: 30px;
        position: relative;
      }

      .coming-soon .text {
        display: inline-block;
        color: rgba(255, 255, 255, 0.7);
        opacity: 0;
        animation: fadeUp 0.8s ease-out 1.4s forwards;
      }

      .coming-soon::before {
        display: none;
      }

      .coming-soon::after {
        display: none;
      }

      /* 메인 버튼 영역 */
      .main-buttons {
        display: flex;
        gap: 20px;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 0;
        margin-bottom: 0;
        transform: translateY(50px);
      }

      .main-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 14px 40px;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 2px;
        text-transform: uppercase;
        text-decoration: none;
        color: #ffffff;
        border: 2px solid #ffffff;
        background: transparent;
        transition: all 0.3s ease;
        cursor: pointer;
        min-width: 180px;
        position: relative;
        overflow: hidden;
      }

      .main-btn::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: #ffffff;
        transition: left 0.3s ease;
        z-index: -1;
      }

      .main-btn:hover {
        color: #000000;
        transform: translateY(-2px);
        box-shadow: 0 10px 30px rgba(255, 255, 255, 0.2);
      }

      .main-btn:hover::before {
        left: 0;
      }

      .main-btn.primary {
        background: #ffffff;
        color: #000000;
      }

      .main-btn.primary::before {
        background: transparent;
      }

      .main-btn.primary:hover {
        background: transparent;
        color: #ffffff;
        border-color: #ffffff;
      }

      /* 키프레임 애니메이션 */
      @keyframes logoReveal {
        0% {
          clip-path: inset(0 100% 0 0);
        }
        100% {
          clip-path: inset(0 0% 0 0);
        }
      }

      @keyframes fadeUp {
        0% {
          opacity: 0;
          transform: translateY(20px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes textFill {
        0% {
          background-position: 100% 0;
        }
        100% {
          background-position: 0% 0;
        }
      }

      @keyframes lineScale {
        0% {
          transform: translateX(-50%) scaleX(0);
        }
        100% {
          transform: translateX(-50%) scaleX(1);
        }
      }

      /* 푸터 */
      footer {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 25px 20px;
        text-align: center;
        color: rgba(255, 255, 255, 0.7);
        font-size: 11px;
        line-height: 1.8;
        background: rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        z-index: 10;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }

      footer p {
        margin-bottom: 0;
      }

      /* 오디션 모달 */
      .audition-modal {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 1000;
        display: none;
        align-items: center;
        justify-content: center;
      }

      .audition-modal.active {
        display: flex;
      }

      .modal-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(5px);
      }

      .modal-content {
        position: relative;
        background: #ffffff;
        border-radius: 16px;
        padding: 40px;
        max-width: 500px;
        width: 90%;
        max-height: 90vh;
        overflow-y: auto;
        animation: modalSlideUp 0.3s ease-out;
      }

      @keyframes modalSlideUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .modal-close {
        position: absolute;
        top: 15px;
        right: 20px;
        background: none;
        border: none;
        font-size: 28px;
        cursor: pointer;
        color: #999;
        transition: color 0.2s;
      }

      .modal-close:hover {
        color: #000;
      }

      .modal-content h2 {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 3px;
        margin-bottom: 8px;
        text-align: center;
      }

      .modal-subtitle {
        text-align: center;
        color: #666;
        font-size: 14px;
        margin-bottom: 30px;
      }

      .audition-form .form-group {
        margin-bottom: 20px;
      }

      .audition-form label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 6px;
        color: #333;
      }

      .audition-form input,
      .audition-form select,
      .audition-form textarea {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        font-size: 14px;
        font-family: inherit;
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      .audition-form input:focus,
      .audition-form select:focus,
      .audition-form textarea:focus {
        outline: none;
        border-color: #000;
        box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.05);
      }

      .audition-form textarea {
        resize: vertical;
        min-height: 100px;
      }

      .form-row {
        display: flex;
        gap: 15px;
      }

      .form-row .form-group {
        flex: 1;
      }

      .checkbox-group {
        margin-top: 10px;
      }

      .checkbox-label {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        cursor: pointer;
        font-size: 13px;
        color: #666;
      }

      .checkbox-label input {
        width: auto;
        margin-top: 2px;
      }

      .submit-btn {
        width: 100%;
        padding: 14px;
        background: #000;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s, transform 0.2s;
        margin-top: 10px;
      }

      .submit-btn:hover {
        background: #333;
        transform: translateY(-1px);
      }

      .form-success {
        text-align: center;
        padding: 40px 20px;
      }

      .success-icon {
        width: 60px;
        height: 60px;
        background: #000;
        color: #fff;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        margin: 0 auto 20px;
      }

      .form-success h3 {
        font-size: 20px;
        margin-bottom: 10px;
      }

      .form-success p {
        color: #666;
        font-size: 14px;
        line-height: 1.6;
      }

      /* 반응형 */
      @media (max-width: 1024px) {
        .coming-soon {
          font-size: 36px;
          letter-spacing: 14px;
        }
      }

      @media (max-width: 768px) {
        header {
          padding: 15px 20px;
        }

        .header-logo img {
          width: 32px;
        }

        .header-logo span {
          font-size: 12px;
        }

        .logo-wrapper img {
          width: 60px;
        }

        .coming-soon {
          font-size: 18px;
          letter-spacing: 4px;
          margin-top: 20px;
        }

        .main-buttons {
          flex-direction: column;
          gap: 15px;
        }

        .main-btn {
          width: 100%;
          max-width: 280px;
          padding: 16px 40px;
          font-size: 14px;
        }

        .video-background video {
          width: 90%;
          height: 90%;
          object-fit: contain;
        }

        footer {
          font-size: 10px;
          padding: 20px 15px;
        }
      }
    </style>
  </head>
  <body>
    <!-- 배경 영상 -->
    <div class="video-background">
      <video autoplay muted loop playsinline>
        <source src="/public/mainproj_v6.mp4" type="video/mp4" />
      </video>
    </div>
    <div class="video-overlay"></div>

    <header>
      <a href="index.html" class="header-logo">
        <img src="/public/images/logo4.png" alt="DURI ENT." />
        <span>DURI ENT.</span>
      </a>

      <ul class="nav-menu" style="display: none"></ul>

      <div class="language-selector">
        <button class="language-btn" aria-label="Select language">
          <span class="current-flag">🇰🇷</span>
        </button>
        <div class="language-dropdown">
          <a href="#" data-lang="ko">
            <span class="flag">🇰🇷</span>
            <span>한국어</span>
          </a>
          <a href="#" data-lang="en">
            <span class="flag">🇺🇸</span>
            <span>English</span>
          </a>
          <a href="#" data-lang="zh">
            <span class="flag">🇨🇳</span>
            <span>中文</span>
          </a>
          <a href="#" data-lang="ja">
            <span class="flag">🇯🇵</span>
            <span>日本語</span>
          </a>
        </div>
      </div>
    </header>

    <div class="container">
      <div class="main-buttons">
        <a
          href="https://www.youtube.com/@DURIENT"
          target="_blank"
          class="main-btn"
          >YOUTUBE</a
        >
        <a href="#" id="audition-btn-main" class="main-btn primary"
          >VIRTUAL AUDITION</a
        >
      </div>
    </div>

    <footer>
      <p>ⓒDURI Entertainment ALL RIGHTS RESERVED.</p>
    </footer>

    <!-- 오디션 지원 모달 -->
    <div class="audition-modal" id="auditionModal">
      <div class="modal-overlay"></div>
      <div class="modal-content">
        <button class="modal-close" id="modalClose">&times;</button>
        <h2>VIRTUAL AUDITION</h2>
        <p class="modal-subtitle" data-i18n="modal.subtitle">
          DURI Entertainment 버추얼 아이돌 오디션
        </p>

        <form id="auditionForm" class="audition-form">
          <div class="form-group">
            <label for="name" data-i18n="form.name">이름 *</label>
            <input
              type="text"
              id="name"
              name="name"
              required
              data-i18n-placeholder="form.namePlaceholder"
              placeholder="실명을 입력해주세요"
            />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="birthdate" data-i18n="form.birthdate"
                >생년월일 *</label
              >
              <input type="date" id="birthdate" name="birthdate" required />
            </div>
            <div class="form-group">
              <label for="gender" data-i18n="form.gender">성별 *</label>
              <select id="gender" name="gender" required>
                <option value="" data-i18n="form.select">선택</option>
                <option value="male" data-i18n="form.male">남성</option>
                <option value="female" data-i18n="form.female">여성</option>
                <option value="other" data-i18n="form.other">기타</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="email" data-i18n="form.email">이메일 *</label>
            <input
              type="email"
              id="email"
              name="email"
              required
              placeholder="example@email.com"
            />
          </div>

          <div class="form-group">
            <label for="phone" data-i18n="form.phone">연락처 *</label>
            <input
              type="tel"
              id="phone"
              name="phone"
              required
              data-i18n-placeholder="form.phonePlaceholder"
              placeholder="010-0000-0000"
            />
          </div>

          <div class="form-group">
            <label for="talent" data-i18n="form.talent">지원 분야 *</label>
            <select id="talent" name="talent" required>
              <option value="" data-i18n="form.selectTalent">
                선택해주세요
              </option>
              <option value="vocal" data-i18n="form.vocal">보컬</option>
              <option value="dance" data-i18n="form.dance">댄스</option>
              <option value="rap" data-i18n="form.rap">랩</option>
              <option value="multi" data-i18n="form.multi">
                멀티 (복수 선택)
              </option>
            </select>
          </div>

          <div class="form-group">
            <label for="experience" data-i18n="form.experience"
              >경력 및 자기소개 *</label
            >
            <textarea
              id="experience"
              name="experience"
              rows="4"
              required
              data-i18n-placeholder="form.experiencePlaceholder"
              placeholder="본인의 경력, 특기, 지원 동기 등을 자유롭게 작성해주세요"
            ></textarea>
          </div>

          <div class="form-group">
            <label for="portfolio" data-i18n="form.portfolio"
              >포트폴리오 링크 (선택)</label
            >
            <input
              type="url"
              id="portfolio"
              name="portfolio"
              data-i18n-placeholder="form.portfolioPlaceholder"
              placeholder="YouTube, Instagram 등 링크"
            />
          </div>

          <div class="form-group checkbox-group">
            <label class="checkbox-label">
              <input type="checkbox" id="privacy" name="privacy" required />
              <span data-i18n="form.privacy"
                >개인정보 수집 및 이용에 동의합니다 *</span
              >
            </label>
          </div>

          <button type="submit" class="submit-btn" data-i18n="form.submit">
            지원하기
          </button>
        </form>

        <div class="form-success" id="formSuccess" style="display: none">
          <div class="success-icon">✓</div>
          <h3 data-i18n="success.title">지원이 완료되었습니다!</h3>
          <p data-i18n="success.message">
            소중한 지원에 감사드립니다.<br />검토 후 개별 연락드리겠습니다.
          </p>
        </div>
      </div>
    </div>

    <script>
      // 오디션 모달
      const auditionLink = document.getElementById("audition-link");
      const auditionModal = document.getElementById("auditionModal");
      const modalClose = document.getElementById("modalClose");
      const modalOverlay = document.querySelector(".modal-overlay");
      const auditionForm = document.getElementById("auditionForm");
      const formSuccess = document.getElementById("formSuccess");

      // 모달 열기 (audition-link가 존재하는 경우에만)
      if (auditionLink) {
        auditionLink.addEventListener("click", (e) => {
          e.preventDefault();
          auditionModal.classList.add("active");
          document.body.style.overflow = "hidden";
        });
      }

      // 모달 닫기
      function closeModal() {
        auditionModal.classList.remove("active");
        document.body.style.overflow = "";
      }

      if (modalClose) {
        modalClose.addEventListener("click", closeModal);
      }
      if (modalOverlay) {
        modalOverlay.addEventListener("click", closeModal);
      }

      // ESC 키로 닫기
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
      });

      // 메인 버튼 클릭 시 모달 열기
      const auditionBtnMain = document.getElementById("audition-btn-main");
      if (auditionBtnMain) {
        auditionBtnMain.addEventListener("click", (e) => {
          e.preventDefault();
          auditionModal.classList.add("active");
          document.body.style.overflow = "hidden";
        });
      }

      // 폼 제출 - 이메일 전송
      if (auditionForm) {
        auditionForm.addEventListener("submit", (e) => {
          e.preventDefault();

          // 폼 데이터 수집
          const formData = new FormData(auditionForm);
          const data = Object.fromEntries(formData);
          const t = translations[currentLang] || translations.ko;

          // 이메일 본문 작성 (현재 언어에 맞춰)
          const emailSubjects = {
            ko: "버추얼 아이돌 오디션 지원",
            en: "Virtual Idol Audition Application",
            zh: "虚拟偶像试镜申请",
            ja: "バーチャルアイドルオーディション応募",
          };

          const genderLabels = {
            ko: { male: "남성", female: "여성", other: "기타" },
            en: { male: "Male", female: "Female", other: "Other" },
            zh: { male: "男性", female: "女性", other: "其他" },
            ja: { male: "男性", female: "女性", other: "その他" },
          };

          const talentLabels = {
            ko: { vocal: "보컬", dance: "댄스", rap: "랩", multi: "멀티" },
            en: { vocal: "Vocal", dance: "Dance", rap: "Rap", multi: "Multi" },
            zh: { vocal: "声乐", dance: "舞蹈", rap: "说唱", multi: "多才艺" },
            ja: {
              vocal: "ボーカル",
              dance: "ダンス",
              rap: "ラップ",
              multi: "マルチ",
            },
          };

          const fieldLabels = {
            ko: {

      // 언어 변경 함수
      function changeLanguage(lang) {
        currentLang = lang;
        const t = translations[lang] || translations.ko;

        // data-i18n 속성이 있는 모든 요소 업데이트
        document.querySelectorAll("[data-i18n]").forEach((el) => {
          const key = el.getAttribute("data-i18n");
          if (t[key]) {
            if (el.tagName === "INPUT" || el.tagName === "TEXTAREA") {
              // placeholder는 별도 처리
            } else {
              el.textContent = t[key];
            }
          }
        });

        // placeholder 업데이트
        document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
          const key = el.getAttribute("data-i18n-placeholder");
          if (t[key]) {
            el.placeholder = t[key];
          }
        });

        // option 태그 업데이트
        document.querySelectorAll("option[data-i18n]").forEach((option) => {
          const key = option.getAttribute("data-i18n");
          if (t[key]) {
            option.textContent = t[key];
          }
        });
      }

      // 언어 선택 (플래그 변경 + 번역 적용)
      document.querySelectorAll(".language-dropdown a").forEach((link) => {

          e.preventDefault();
          const lang = link.getAttribute("data-lang");
          const flag = link.querySelector(".flag").textContent;
          document.querySelector(".current-flag").textContent = flag;
          langDropdown.classList.remove("active");
          changeLanguage(lang);
