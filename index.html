<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DURI Entertainment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        height: 100%;
      }

      body {
        background-color: #ffffff;
        color: #000000;
        font-family: 'Inter', 'Noto Sans KR', sans-serif;
        min-height: 100vh;
        overflow-x: hidden;
      }

      /* 헤더 */
      header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        padding: 20px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #ffffff;
        z-index: 100;
      }

      /* 로고 (좌측) */
      .header-logo {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        color: #000000;
      }

      .header-logo img {
        width: 40px;
        height: auto;
      }

      .header-logo span {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 2px;
      }

      /* 네비게이션 (가운데) */
      .nav-menu {
        display: flex;
        gap: 0;
        list-style: none;
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        align-items: center;
      }

      .nav-menu li {
        display: flex;
        align-items: center;
      }

      .nav-menu li:not(:last-child)::after {
        content: '/';
        margin: 0 16px;
        color: #cccccc;
        font-size: 14px;
        font-weight: 300;
      }

      .nav-menu a {
        font-size: 14px;
        font-weight: 500;
        color: #000000;
        text-decoration: none;
        letter-spacing: 0.5px;
        transition: color 0.3s ease;
        white-space: nowrap;
      }

      .nav-menu a:hover {
        color: #666666;
      }

      /* 언어 설정 (우측) */
      .language-selector {
        position: relative;
      }

      .language-btn {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 24px;
        padding: 5px;
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .language-btn::after {
        content: '';
        width: 0;
        height: 0;
        border-left: 4px solid transparent;
        border-right: 4px solid transparent;
        border-top: 5px solid #000000;
        margin-left: 5px;
      }

      .language-dropdown {
        position: absolute;
        top: 100%;
        right: 0;
        background: #ffffff;
        border: 1px solid #eeeeee;
        border-radius: 8px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        display: none;
        min-width: 120px;
        overflow: hidden;
      }

      .language-dropdown.active {
        display: block;
      }

      .language-dropdown a {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        text-decoration: none;
        color: #000000;
        font-size: 13px;
        transition: background 0.2s ease;
      }

      .language-dropdown a:hover {
        background: #f5f5f5;
      }

      .language-dropdown a .flag {
        font-size: 18px;
      }

      /* 모바일 메뉴 토글 */
      .mobile-menu-toggle {
        display: none;
        flex-direction: column;
        gap: 5px;
        background: none;
        border: none;
        cursor: pointer;
        padding: 5px;
      }

      .mobile-menu-toggle span {
        width: 24px;
        height: 2px;
        background: #000000;
        transition: all 0.3s ease;
      }

      /* 메인 컨테이너 */
      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 120px 20px 100px;
        text-align: center;
      }

      /* 메인 로고 영역 */
      .logo-wrapper {
        margin-bottom: 30px;
      }

      .logo-wrapper img {
        width: 220px;
        height: auto;
        margin-bottom: 30px;
        clip-path: inset(0 100% 0 0);
        animation: logoReveal 1.5s cubic-bezier(0.77, 0, 0.175, 1) forwards;
      }

      .logo-text {
        display: block;
        font-size: 42px;
        font-weight: 700;
        letter-spacing: 14px;
        color: #000000;
        opacity: 0;
        transform: translateY(20px);
        animation: fadeUp 0.8s ease-out 0.8s forwards;
      }

      /* Coming Soon */
      .coming-soon {
        font-size: 56px;
        font-weight: 200;
        letter-spacing: 24px;
        color: #000000;
        text-transform: lowercase;
        margin-top: 50px;
        position: relative;
      }

      .coming-soon .text {
        display: inline-block;
        background: linear-gradient(90deg, #000 0%, #000 50%, transparent 50%);
        background-size: 200% 100%;
        background-position: 100% 0;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: textFill 1.2s ease-out 1.4s forwards;
      }

      .coming-soon::before {
        content: 'coming soon';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        color: #e0e0e0;
        z-index: -1;
      }

      .coming-soon::after {
        content: '';
        position: absolute;
        bottom: -20px;
        left: 50%;
        transform: translateX(-50%) scaleX(0);
        width: 300px;
        height: 1px;
        background: #000;
        animation: lineScale 0.8s ease-out 2s forwards;
      }

      /* 키프레임 애니메이션 */
      @keyframes logoReveal {
        0% {
          clip-path: inset(0 100% 0 0);
        }
        100% {
          clip-path: inset(0 0% 0 0);
        }
      }

      @keyframes fadeUp {
        0% {
          opacity: 0;
          transform: translateY(20px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes textFill {
        0% {
          background-position: 100% 0;
        }
        100% {
          background-position: 0% 0;
        }
      }

      @keyframes lineScale {
        0% {
          transform: translateX(-50%) scaleX(0);
        }
        100% {
          transform: translateX(-50%) scaleX(1);
        }
      }

      /* 푸터 */
      footer {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 25px 20px;
        text-align: center;
        color: #999999;
        font-size: 11px;
        line-height: 1.8;
        background: #ffffff;
      }

      footer p {
        margin-bottom: 2px;
      }

      /* 반응형 */
      @media (max-width: 1200px) {
        .nav-menu li:not(:last-child)::after {
          margin: 0 12px;
        }

        .nav-menu a {
          font-size: 12px;
        }
      }

      @media (max-width: 1024px) {
        .nav-menu li:not(:last-child)::after {
          margin: 0 10px;
          font-size: 12px;
        }

        .nav-menu a {
          font-size: 11px;
        }

        .coming-soon {
          font-size: 36px;
          letter-spacing: 14px;
        }
      }

      @media (max-width: 768px) {
        header {
          padding: 15px 20px;
        }

        .mobile-menu-toggle {
          display: flex;
        }

        .nav-menu {
          position: fixed;
          top: 60px;
          left: 0;
          right: 0;
          background: #ffffff;
          flex-direction: column;
          align-items: center;
          gap: 0;
          padding: 20px;
          border-bottom: 1px solid #eeeeee;
          transform: translateX(-50%) translateY(-150%);
          opacity: 0;
          transition: all 0.3s ease;
        }

        .nav-menu.active {
          transform: translateX(-50%) translateY(0);
          opacity: 1;
        }

        .nav-menu li {
          width: 100%;
          text-align: center;
        }

        .nav-menu li:not(:last-child)::after {
          display: none;
        }

        .nav-menu a {
          display: block;
          padding: 15px;
          font-size: 14px;
        }

        .header-logo img {
          width: 32px;
        }

        .header-logo span {
          font-size: 12px;
        }

        .logo-wrapper img {
          width: 140px;
        }

        .logo-text {
          font-size: 28px;
          letter-spacing: 8px;
        }

        .coming-soon {
          font-size: 32px;
          letter-spacing: 12px;
        }

        .coming-soon::after {
          bottom: -15px;
          width: 200px;
        }

        footer {
          font-size: 10px;
          padding: 20px 15px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="index.html" class="header-logo">
        <img src="public/images/logo4.png" alt="DURI ENT." />
        <span>DURI ENT.</span>
      </a>

      <button class="mobile-menu-toggle" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <ul class="nav-menu">
        <li><a href="#">ABOUT</a></li>
        <li><a href="#">PROJECT</a></li>
        <li><a href="#">MEMBERS</a></li>
        <li><a href="#">VOTE & MISSIONS</a></li>
        <li><a href="#">LIVE</a></li>
        <li><a href="#">MUSIC & VIDEO</a></li>
        <li><a href="#">SHOP</a></li>
      </ul>

      <div class="language-selector">
        <button class="language-btn" aria-label="Select language">
          <span class="current-flag">🇰🇷</span>
        </button>
        <div class="language-dropdown">
          <a href="#" data-lang="ko">
            <span class="flag">🇰🇷</span>
            <span>한국어</span>
          </a>
          <a href="#" data-lang="en">
            <span class="flag">🇺🇸</span>
            <span>English</span>
          </a>
          <a href="#" data-lang="zh">
            <span class="flag">🇨🇳</span>
            <span>中文</span>
          </a>
          <a href="#" data-lang="ja">
            <span class="flag">🇯🇵</span>
            <span>日本語</span>
          </a>
        </div>
      </div>
    </header>

    <div class="container">
      <div class="logo-wrapper">
        <img src="public/images/logo4.png" alt="DURI ENT." />
        <span class="logo-text">DURI ENT.</span>
      </div>
      <h1 class="coming-soon">
        <span class="text">coming soon</span>
      </h1>
    </div>

    <footer>
      <p>DURI Entertainment</p>
      <p class="footer-info"></p>
      <p class="footer-address"></p>
    </footer>

    <script>
      // 다국어 텍스트
      const translations = {
        ko: {
          menu: ['ABOUT', 'PROJECT', 'MEMBERS', 'VOTE & MISSIONS', 'LIVE', 'MUSIC & VIDEO', 'SHOP'],
          info: '사업자번호: 000-00-00000 | 대표: OOO',
          address: '서울특별시 광진구 자양로 217-1, 지하1층, 5층, 6층 (구의동)'
        },
        en: {
          menu: ['ABOUT', 'PROJECT', 'MEMBERS', 'VOTE & MISSIONS', 'LIVE', 'MUSIC & VIDEO', 'SHOP'],
          info: 'Business Reg: 000-00-00000 | CEO: OOO',
          address: '217-1 Jayang-ro, Gwangjin-gu, Seoul, South Korea (B1F, 5F, 6F)'
        },
        zh: {
          menu: ['关于', '项目', '成员', '投票&任务', '直播', '音乐&视频', '商店'],
          info: '营业执照号: 000-00-00000 | 代表: OOO',
          address: '首尔特别市广津区紫阳路217-1, 地下1层, 5层, 6层 (九宜洞)'
        },
        ja: {
          menu: ['紹介', 'プロジェクト', 'メンバー', '投票&ミッション', 'ライブ', '音楽&動画', 'ショップ'],
          info: '事業者番号: 000-00-00000 | 代表: OOO',
          address: 'ソウル特別市広津区紫陽路217-1, 地下1階, 5階, 6階 (九宜洞)'
        }
      };

      const flags = {
        ko: '🇰🇷',
        en: '🇺🇸',
        zh: '🇨🇳',
        ja: '🇯🇵'
      };

      let currentLang = 'ko';

      // 언어 변경 함수
      function changeLanguage(lang) {
        currentLang = lang;
        const texts = translations[lang];

        // 플래그 변경
        document.querySelector('.current-flag').textContent = flags[lang];

        // 메뉴 텍스트 변경
        const menuItems = document.querySelectorAll('.nav-menu a');
        menuItems.forEach((item, index) => {
          item.textContent = texts.menu[index];
        });

        // 푸터 텍스트 변경
        document.querySelector('.footer-info').textContent = texts.info;
        document.querySelector('.footer-address').textContent = texts.address;
      }

      // 언어 드롭다운 토글
      const langBtn = document.querySelector('.language-btn');
      const langDropdown = document.querySelector('.language-dropdown');

      langBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        langDropdown.classList.toggle('active');
      });

      // 언어 선택
      document.querySelectorAll('.language-dropdown a').forEach(link => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          const lang = link.getAttribute('data-lang');
          changeLanguage(lang);
          langDropdown.classList.remove('active');
        });
      });

      // 외부 클릭시 드롭다운 닫기
      document.addEventListener('click', () => {
        langDropdown.classList.remove('active');
      });

      // 모바일 메뉴 토글
      const mobileToggle = document.querySelector('.mobile-menu-toggle');
      const navMenu = document.querySelector('.nav-menu');

      mobileToggle.addEventListener('click', () => {
        navMenu.classList.toggle('active');
      });

      // 초기 언어 설정
      changeLanguage('ko');
    </script>
  </body>
</html>
