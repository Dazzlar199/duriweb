<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DURI Entertainment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        height: 100%;
      }

      body {
        background-color: #ffffff;
        color: #000000;
        font-family: 'Inter', 'Noto Sans KR', sans-serif;
        min-height: 100vh;
        overflow-x: hidden;
      }

      /* 헤더 */
      header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        padding: 20px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #ffffff;
        z-index: 100;
      }

      /* 로고 (좌측) */
      .header-logo {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        color: #000000;
      }

      .header-logo img {
        width: 40px;
        height: auto;
      }

      .header-logo span {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 2px;
      }

      /* 네비게이션 (가운데) */
      .nav-menu {
        display: flex;
        gap: 0;
        list-style: none;
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        align-items: center;
      }

      .nav-menu li {
        display: flex;
        align-items: center;
      }

      .nav-menu li:not(:last-child)::after {
        content: '/';
        margin: 0 16px;
        color: #cccccc;
        font-size: 14px;
        font-weight: 300;
      }

      .nav-menu a {
        font-size: 14px;
        font-weight: 500;
        color: #000000;
        text-decoration: none;
        letter-spacing: 0.5px;
        transition: color 0.3s ease;
        white-space: nowrap;
      }

      .nav-menu a:hover {
        color: #666666;
      }

      /* 언어 설정 (우측) */
      .language-selector {
        position: relative;
      }

      .language-btn {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 24px;
        padding: 5px;
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .language-btn::after {
        content: '';
        width: 0;
        height: 0;
        border-left: 4px solid transparent;
        border-right: 4px solid transparent;
        border-top: 5px solid #000000;
        margin-left: 5px;
      }

      .language-dropdown {
        position: absolute;
        top: 100%;
        right: 0;
        background: #ffffff;
        border: 1px solid #eeeeee;
        border-radius: 8px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        display: none;
        min-width: 120px;
        overflow: hidden;
      }

      .language-dropdown.active {
        display: block;
      }

      .language-dropdown a {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        text-decoration: none;
        color: #000000;
        font-size: 13px;
        transition: background 0.2s ease;
      }

      .language-dropdown a:hover {
        background: #f5f5f5;
      }

      .language-dropdown a .flag {
        font-size: 18px;
      }

      /* 모바일 메뉴 토글 */
      .mobile-menu-toggle {
        display: none;
        flex-direction: column;
        gap: 5px;
        background: none;
        border: none;
        cursor: pointer;
        padding: 5px;
      }

      .mobile-menu-toggle span {
        width: 24px;
        height: 2px;
        background: #000000;
        transition: all 0.3s ease;
      }

      /* 메인 컨테이너 */
      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 120px 20px 100px;
        text-align: center;
      }

      /* 메인 로고 영역 */
      .logo-wrapper {
        margin-bottom: 30px;
      }

      .logo-wrapper img {
        width: 220px;
        height: auto;
        margin-bottom: 30px;
        clip-path: inset(0 100% 0 0);
        animation: logoReveal 1.5s cubic-bezier(0.77, 0, 0.175, 1) forwards;
      }

      .logo-text {
        display: block;
        font-size: 42px;
        font-weight: 700;
        letter-spacing: 14px;
        color: #000000;
        opacity: 0;
        transform: translateY(20px);
        animation: fadeUp 0.8s ease-out 0.8s forwards;
      }

      /* Coming Soon */
      .coming-soon {
        font-size: 56px;
        font-weight: 200;
        letter-spacing: 24px;
        color: #000000;
        text-transform: lowercase;
        margin-top: 50px;
        position: relative;
      }

      .coming-soon .text {
        display: inline-block;
        background: linear-gradient(90deg, #000 0%, #000 50%, transparent 50%);
        background-size: 200% 100%;
        background-position: 100% 0;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: textFill 1.2s ease-out 1.4s forwards;
      }

      .coming-soon::before {
        content: 'coming soon';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        color: #e0e0e0;
        z-index: -1;
      }

      .coming-soon::after {
        content: '';
        position: absolute;
        bottom: -20px;
        left: 50%;
        transform: translateX(-50%) scaleX(0);
        width: 300px;
        height: 1px;
        background: #000;
        animation: lineScale 0.8s ease-out 2s forwards;
      }

      /* 키프레임 애니메이션 */
      @keyframes logoReveal {
        0% {
          clip-path: inset(0 100% 0 0);
        }
        100% {
          clip-path: inset(0 0% 0 0);
        }
      }

      @keyframes fadeUp {
        0% {
          opacity: 0;
          transform: translateY(20px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes textFill {
        0% {
          background-position: 100% 0;
        }
        100% {
          background-position: 0% 0;
        }
      }

      @keyframes lineScale {
        0% {
          transform: translateX(-50%) scaleX(0);
        }
        100% {
          transform: translateX(-50%) scaleX(1);
        }
      }

      /* 푸터 */
      footer {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 25px 20px;
        text-align: center;
        color: #999999;
        font-size: 11px;
        line-height: 1.8;
        background: #ffffff;
      }

      footer p {
        margin-bottom: 0;
      }

      /* 오디션 모달 */
      .audition-modal {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 1000;
        display: none;
        align-items: center;
        justify-content: center;
      }

      .audition-modal.active {
        display: flex;
      }

      .modal-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(5px);
      }

      .modal-content {
        position: relative;
        background: #ffffff;
        border-radius: 16px;
        padding: 40px;
        max-width: 500px;
        width: 90%;
        max-height: 90vh;
        overflow-y: auto;
        animation: modalSlideUp 0.3s ease-out;
      }

      @keyframes modalSlideUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .modal-close {
        position: absolute;
        top: 15px;
        right: 20px;
        background: none;
        border: none;
        font-size: 28px;
        cursor: pointer;
        color: #999;
        transition: color 0.2s;
      }

      .modal-close:hover {
        color: #000;
      }

      .modal-content h2 {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 3px;
        margin-bottom: 8px;
        text-align: center;
      }

      .modal-subtitle {
        text-align: center;
        color: #666;
        font-size: 14px;
        margin-bottom: 30px;
      }

      .audition-form .form-group {
        margin-bottom: 20px;
      }

      .audition-form label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 6px;
        color: #333;
      }

      .audition-form input,
      .audition-form select,
      .audition-form textarea {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        font-size: 14px;
        font-family: inherit;
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      .audition-form input:focus,
      .audition-form select:focus,
      .audition-form textarea:focus {
        outline: none;
        border-color: #000;
        box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.05);
      }

      .audition-form textarea {
        resize: vertical;
        min-height: 100px;
      }

      .form-row {
        display: flex;
        gap: 15px;
      }

      .form-row .form-group {
        flex: 1;
      }

      .checkbox-group {
        margin-top: 10px;
      }

      .checkbox-label {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        cursor: pointer;
        font-size: 13px;
        color: #666;
      }

      .checkbox-label input {
        width: auto;
        margin-top: 2px;
      }

      .submit-btn {
        width: 100%;
        padding: 14px;
        background: #000;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s, transform 0.2s;
        margin-top: 10px;
      }

      .submit-btn:hover {
        background: #333;
        transform: translateY(-1px);
      }

      .form-success {
        text-align: center;
        padding: 40px 20px;
      }

      .success-icon {
        width: 60px;
        height: 60px;
        background: #000;
        color: #fff;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        margin: 0 auto 20px;
      }

      .form-success h3 {
        font-size: 20px;
        margin-bottom: 10px;
      }

      .form-success p {
        color: #666;
        font-size: 14px;
        line-height: 1.6;
      }

      /* 반응형 */
      @media (max-width: 1200px) {
        .nav-menu li:not(:last-child)::after {
          margin: 0 12px;
        }

        .nav-menu a {
          font-size: 12px;
        }
      }

      @media (max-width: 1024px) {
        .nav-menu li:not(:last-child)::after {
          margin: 0 10px;
          font-size: 12px;
        }

        .nav-menu a {
          font-size: 11px;
        }

        .coming-soon {
          font-size: 36px;
          letter-spacing: 14px;
        }
      }

      @media (max-width: 768px) {
        header {
          padding: 15px 20px;
        }

        .mobile-menu-toggle {
          display: flex;
        }

        .nav-menu {
          position: fixed;
          top: 60px;
          left: 0;
          right: 0;
          background: #ffffff;
          flex-direction: column;
          align-items: center;
          gap: 0;
          padding: 20px;
          border-bottom: 1px solid #eeeeee;
          transform: translateX(-50%) translateY(-150%);
          opacity: 0;
          transition: all 0.3s ease;
        }

        .nav-menu.active {
          transform: translateX(-50%) translateY(0);
          opacity: 1;
        }

        .nav-menu li {
          width: 100%;
          text-align: center;
        }

        .nav-menu li:not(:last-child)::after {
          display: none;
        }

        .nav-menu a {
          display: block;
          padding: 15px;
          font-size: 14px;
        }

        .header-logo img {
          width: 32px;
        }

        .header-logo span {
          font-size: 12px;
        }

        .logo-wrapper img {
          width: 140px;
        }

        .logo-text {
          font-size: 28px;
          letter-spacing: 8px;
        }

        .coming-soon {
          font-size: 32px;
          letter-spacing: 12px;
        }

        .coming-soon::after {
          bottom: -15px;
          width: 200px;
        }

        footer {
          font-size: 10px;
          padding: 20px 15px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="index.html" class="header-logo">
        <img src="public/images/logo4.png" alt="DURI ENT." />
        <span>DURI ENT.</span>
      </a>

      <button class="mobile-menu-toggle" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <ul class="nav-menu">
        <li><a href="#" id="audition-link">VIRTUAL AUDITION</a></li>
      </ul>

      <div class="language-selector">
        <button class="language-btn" aria-label="Select language">
          <span class="current-flag">🇰🇷</span>
        </button>
        <div class="language-dropdown">
          <a href="#" data-lang="ko">
            <span class="flag">🇰🇷</span>
            <span>한국어</span>
          </a>
          <a href="#" data-lang="en">
            <span class="flag">🇺🇸</span>
            <span>English</span>
          </a>
          <a href="#" data-lang="zh">
            <span class="flag">🇨🇳</span>
            <span>中文</span>
          </a>
          <a href="#" data-lang="ja">
            <span class="flag">🇯🇵</span>
            <span>日本語</span>
          </a>
        </div>
      </div>
    </header>

    <div class="container">
      <div class="logo-wrapper">
        <img src="public/images/logo4.png" alt="DURI ENT." />
        <span class="logo-text">DURI ENT.</span>
      </div>
      <h1 class="coming-soon">
        <span class="text">coming soon</span>
      </h1>
    </div>

    <footer>
      <p>ⓒDURI Entertainment ALL RIGHTS RESERVED.</p>
    </footer>

    <!-- 오디션 지원 모달 -->
    <div class="audition-modal" id="auditionModal">
      <div class="modal-overlay"></div>
      <div class="modal-content">
        <button class="modal-close" id="modalClose">&times;</button>
        <h2>VIRTUAL AUDITION</h2>
        <p class="modal-subtitle">DURI Entertainment 버추얼 아이돌 오디션</p>

        <form id="auditionForm" class="audition-form">
          <div class="form-group">
            <label for="name">이름 *</label>
            <input type="text" id="name" name="name" required placeholder="실명을 입력해주세요">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="birthdate">생년월일 *</label>
              <input type="date" id="birthdate" name="birthdate" required>
            </div>
            <div class="form-group">
              <label for="gender">성별 *</label>
              <select id="gender" name="gender" required>
                <option value="">선택</option>
                <option value="male">남성</option>
                <option value="female">여성</option>
                <option value="other">기타</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="email">이메일 *</label>
            <input type="email" id="email" name="email" required placeholder="example@email.com">
          </div>

          <div class="form-group">
            <label for="phone">연락처 *</label>
            <input type="tel" id="phone" name="phone" required placeholder="010-0000-0000">
          </div>

          <div class="form-group">
            <label for="talent">지원 분야 *</label>
            <select id="talent" name="talent" required>
              <option value="">선택해주세요</option>
              <option value="vocal">보컬</option>
              <option value="dance">댄스</option>
              <option value="rap">랩</option>
              <option value="multi">멀티 (복수 선택)</option>
            </select>
          </div>

          <div class="form-group">
            <label for="experience">경력 및 자기소개 *</label>
            <textarea id="experience" name="experience" rows="4" required placeholder="본인의 경력, 특기, 지원 동기 등을 자유롭게 작성해주세요"></textarea>
          </div>

          <div class="form-group">
            <label for="portfolio">포트폴리오 링크 (선택)</label>
            <input type="url" id="portfolio" name="portfolio" placeholder="YouTube, Instagram 등 링크">
          </div>

          <div class="form-group checkbox-group">
            <label class="checkbox-label">
              <input type="checkbox" id="privacy" name="privacy" required>
              <span>개인정보 수집 및 이용에 동의합니다 *</span>
            </label>
          </div>

          <button type="submit" class="submit-btn">지원하기</button>
        </form>

        <div class="form-success" id="formSuccess" style="display: none;">
          <div class="success-icon">✓</div>
          <h3>지원이 완료되었습니다!</h3>
          <p>소중한 지원에 감사드립니다.<br>검토 후 개별 연락드리겠습니다.</p>
        </div>
      </div>
    </div>

    <script>
      // 오디션 모달
      const auditionLink = document.getElementById('audition-link');
      const auditionModal = document.getElementById('auditionModal');
      const modalClose = document.getElementById('modalClose');
      const modalOverlay = document.querySelector('.modal-overlay');
      const auditionForm = document.getElementById('auditionForm');
      const formSuccess = document.getElementById('formSuccess');

      // 모달 열기
      auditionLink.addEventListener('click', (e) => {
        e.preventDefault();
        auditionModal.classList.add('active');
        document.body.style.overflow = 'hidden';
      });

      // 모달 닫기
      function closeModal() {
        auditionModal.classList.remove('active');
        document.body.style.overflow = '';
      }

      modalClose.addEventListener('click', closeModal);
      modalOverlay.addEventListener('click', closeModal);

      // ESC 키로 닫기
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeModal();
      });

      // 폼 제출
      auditionForm.addEventListener('submit', (e) => {
        e.preventDefault();

        // 폼 데이터 수집 (실제로는 서버로 전송)
        const formData = new FormData(auditionForm);
        console.log('오디션 지원 데이터:', Object.fromEntries(formData));

        // 성공 메시지 표시
        auditionForm.style.display = 'none';
        formSuccess.style.display = 'block';

        // 3초 후 모달 닫기
        setTimeout(() => {
          closeModal();
          auditionForm.style.display = 'block';
          formSuccess.style.display = 'none';
          auditionForm.reset();
        }, 3000);
      });

      // 언어 드롭다운 토글
      const langBtn = document.querySelector('.language-btn');
      const langDropdown = document.querySelector('.language-dropdown');

      langBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        langDropdown.classList.toggle('active');
      });

      // 언어 선택 (플래그만 변경)
      document.querySelectorAll('.language-dropdown a').forEach(link => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          const flag = link.querySelector('.flag').textContent;
          document.querySelector('.current-flag').textContent = flag;
          langDropdown.classList.remove('active');
        });
      });

      // 외부 클릭시 드롭다운 닫기
      document.addEventListener('click', () => {
        langDropdown.classList.remove('active');
      });

      // 모바일 메뉴 토글
      const mobileToggle = document.querySelector('.mobile-menu-toggle');
      const navMenu = document.querySelector('.nav-menu');

      mobileToggle.addEventListener('click', () => {
        navMenu.classList.toggle('active');
      });
    </script>
  </body>
</html>
